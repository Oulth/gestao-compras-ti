<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #eff6ff;
    --secondary: #475569;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --info: #06b6d4;
    --bg-main: #f8fafc;
    --card-bg: #ffffff;
    --text-dark: #0f172a;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --radius-lg: 1rem;
    --radius-md: 0.625rem;
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.07), 0 1px 2px -1px rgb(0 0 0 / 0.07);
    --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.08);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  }

  body {
    background-color: var(--bg-main);
    color: var(--text-dark);
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    margin: 0;
    padding-bottom: 3rem;
  }

  /* Navbar */
  .navbar-custom {
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    padding: 0.85rem 1.5rem;
  }
  .brand-badge {
    background: rgba(37, 99, 235, 0.25);
    color: #60a5fa;
    border: 1px solid rgba(96, 165, 250, 0.3);
    font-size: 0.75rem;
    padding: 0.2rem 0.6rem;
    border-radius: 9999px;
    font-weight: 600;
  }
  .user-badge {
    background: rgba(255, 255, 255, 0.1);
    color: #cbd5e1;
    font-size: 0.8rem;
    padding: 0.35rem 0.8rem;
    border-radius: 9999px;
  }

  /* Navigation Pills */
  .nav-pills-custom {
    background: #ffffff;
    padding: 0.4rem;
    border-radius: var(--radius-md);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    display: inline-flex;
    gap: 0.3rem;
  }
  .nav-pills-custom .nav-link {
    color: var(--secondary);
    font-weight: 500;
    font-size: 0.9rem;
    padding: 0.5rem 1.1rem;
    border-radius: 0.5rem;
    transition: all 0.2s ease;
  }
  .nav-pills-custom .nav-link:hover {
    color: var(--primary);
    background: var(--primary-light);
  }
  .nav-pills-custom .nav-link.active {
    background: var(--primary);
    color: #ffffff;
    box-shadow: 0 4px 10px rgba(37, 99, 235, 0.35);
  }

  /* KPI Cards */
  .kpi-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    padding: 1.35rem;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    position: relative;
    overflow: hidden;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .kpi-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: var(--primary);
  }
  .kpi-card.kpi-success::before { background: var(--success); }
  .kpi-card.kpi-warning::before { background: var(--warning); }
  .kpi-card.kpi-info::before { background: var(--info); }

  .kpi-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.35rem;
  }
  .kpi-icon.blue { background: #dbeafe; color: #1d4ed8; }
  .kpi-icon.green { background: #dcfce7; color: #15803d; }
  .kpi-icon.amber { background: #fef3c7; color: #b45309; }
  .kpi-icon.cyan { background: #cffafe; color: #0e7490; }

  .kpi-value {
    font-size: 1.75rem;
    font-weight: 700;
    color: var(--text-dark);
    letter-spacing: -0.02em;
    margin: 0.3rem 0 0.1rem 0;
  }
  .kpi-title {
    font-size: 0.82rem;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.04em;
  }

  /* Content Cards */
  .app-card {
    background: var(--card-bg);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.5rem;
  }
  .app-card-header {
    padding: 1.1rem 1.35rem;
    border-bottom: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .app-card-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-dark);
    margin: 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .app-card-body {
    padding: 1.35rem;
  }

  /* Table styling */
  .table-custom {
    margin: 0;
    border-collapse: separate;
    border-spacing: 0;
  }
  .table-custom thead th {
    background-color: #f1f5f9;
    color: #475569;
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border-color);
    white-space: nowrap;
  }
  .table-custom tbody td {
    padding: 0.9rem 1rem;
    vertical-align: middle;
    font-size: 0.88rem;
    border-bottom: 1px solid #f1f5f9;
  }
  .table-custom tbody tr:hover {
    background-color: #f8fafc;
  }

  /* Badges */
  .badge-status {
    padding: 0.35rem 0.65rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
  }
  .badge-pago { background: #dcfce7; color: #166534; }
  .badge-pendente { background: #fef3c7; color: #92400e; }
  .badge-parcelado { background: #e0e7ff; color: #3730a3; }
  .badge-cancelado { background: #fee2e2; color: #991b1b; }

  .badge-tipo {
    padding: 0.25rem 0.55rem;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  .badge-tipo-produto { background: #e0f2fe; color: #0369a1; }
  .badge-tipo-servico { background: #f3e8ff; color: #6b21a8; }
  .badge-tipo-saas { background: #fef08a; color: #854d0e; }

  /* Buttons */
  .btn-primary-custom {
    background-color: var(--primary);
    border-color: var(--primary);
    color: white;
    font-weight: 500;
    border-radius: var(--radius-md);
    padding: 0.55rem 1.25rem;
    transition: all 0.2s ease;
  }
  .btn-primary-custom:hover {
    background-color: var(--primary-dark);
    border-color: var(--primary-dark);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
  }

  /* Loading Spinner */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    color: white;
  }
  .spinner-custom {
    width: 3.5rem;
    height: 3.5rem;
    border: 4px solid rgba(255, 255, 255, 0.2);
    border-top-color: #38bdf8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* CNPJ search button */
  .btn-cnpj-search {
    border-top-left-radius: 0;
    border-bottom-left-radius: 0;
  }

  /* File upload drag drop zone */
  .drop-zone {
    border: 2px dashed #cbd5e1;
    border-radius: var(--radius-md);
    padding: 1.5rem;
    text-align: center;
    background: #f8fafc;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  /* Print Styles */
  @media print {
    body {
      background: white;
      padding: 0;
    }
    .no-print, .navbar-custom, .nav-pills-custom, .btn, .modal {
      display: none !important;
    }
    .app-card {
      box-shadow: none;
      border: 1px solid #ddd;
      page-break-inside: avoid;
    }
  }
</style>
